<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LedgerFlow Synthetic Invoice Fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e5e7eb; color: #172033; font: 16px Arial, sans-serif; }
    .sheet { width: 1040px; min-height: 1420px; margin: 0 auto; padding: 56px 64px; background: #fff; }
    .low-quality { filter: contrast(.88) blur(.55px); transform: rotate(-.35deg) scale(.99); transform-origin: center; }
    .header { display: flex; justify-content: space-between; border-bottom: 4px solid #184b9b; padding-bottom: 24px; }
    .brand { color: #184b9b; font-size: 34px; font-weight: 700; letter-spacing: .4px; }
    .brand-subtitle { margin-top: 6px; color: #667085; font-size: 14px; }
    .invoice-title { text-align: right; color: #184b9b; font-size: 28px; font-weight: 700; }
    .invoice-number { margin-top: 8px; color: #475467; font-size: 16px; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin: 42px 0; }
    .label { margin-bottom: 8px; color: #667085; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .value { margin-bottom: 8px; font-size: 18px; line-height: 1.4; }
    .missing { color: #9f1f1f; font-style: italic; }
    table { width: 100%; border-collapse: collapse; margin-top: 22px; }
    th { padding: 13px 12px; background: #184b9b; color: #fff; font-size: 14px; text-align: left; }
    td { padding: 14px 12px; border-bottom: 1px solid #d0d5dd; font-size: 16px; }
    td.number, th.number { text-align: right; }
    .bottom { display: grid; grid-template-columns: 1fr 380px; gap: 42px; margin-top: 46px; }
    .note { padding: 18px; border-left: 4px solid #184b9b; background: #eff6ff; color: #344054; line-height: 1.45; }
    .totals { border-top: 2px solid #344054; }
    .total-row { display: flex; justify-content: space-between; padding: 11px 0; }
    .grand-total { margin-top: 8px; padding-top: 14px; border-top: 2px solid #184b9b; color: #184b9b; font-size: 22px; font-weight: 700; }
    .footer { margin-top: 116px; padding-top: 24px; border-top: 1px solid #d0d5dd; color: #667085; font-size: 13px; }
    .signature { margin-top: 54px; text-align: right; color: #344054; }
  </style>
</head>
<body>
  <main id="invoice" class="sheet"></main>
  <script>
    const cases = {
      "clean-domestic": {
        supplier: "Madhya Steel Traders", gstin: "23ABCDE1234F1Z5", address: "Govindpura Industrial Area, Bhopal, MP",
        number: "MST-2026-081", date: "20 Aug 2026", buyer: "Apex Fabrication Works", buyerGstin: "23FAKEP5678L1Z3",
        items: [["GI Pipe", "20", "500.00", "10,000.00"], ["Welding Wire", "5", "300.00", "1,500.00"]],
        subtotal: "11,500.00", cgst: "1,035.00", sgst: "1,035.00", igst: "0.00", total: "13,570.00"
      },
      "missing-gstin": {
        supplier: "Bhopal Packaging Works", gstin: null, address: "Mandideep, Raisen, MP",
        number: "BPW-4402", date: "21 Aug 2026", buyer: "Metro Distributors", buyerGstin: "23FAKEM1234N1Z6",
        items: [["Corrugated Box", "250", "50.00", "12,500.00"]],
        subtotal: "12,500.00", cgst: "1,125.00", sgst: "1,125.00", igst: "0.00", total: "14,750.00"
      },
      "total-mismatch": {
        supplier: "Narmada Industrial Supplies", gstin: "23PQRSX6789K1Z2", address: "Hoshangabad Road, Bhopal, MP",
        number: "NIS-778", date: "22 Aug 2026", buyer: "Apex Fabrication Works", buyerGstin: "23FAKEP5678L1Z3",
        items: [["Safety Gloves", "10", "200.00", "2,000.00"]],
        subtotal: "2,000.00", cgst: "180.00", sgst: "180.00", igst: "0.00", total: "2,000.00"
      },
      "duplicate-invoice": {
        supplier: "Madhya Steel Traders", gstin: "23ABCDE1234F1Z5", address: "Govindpura Industrial Area, Bhopal, MP",
        number: "MST-2026-081", date: "20 Aug 2026", buyer: "Apex Fabrication Works", buyerGstin: "23FAKEP5678L1Z3",
        items: [["GI Pipe", "20", "500.00", "10,000.00"], ["Welding Wire", "5", "300.00", "1,500.00"]],
        subtotal: "11,500.00", cgst: "1,035.00", sgst: "1,035.00", igst: "0.00", total: "13,570.00"
      },
      "interstate-igst": {
        supplier: "Indore Tools and Fasteners", gstin: "23LMNOP4321Q1Z7", address: "Pithampur, Dhar, MP",
        number: "ITF-0926", date: "23 Aug 2026", buyer: "Nagpur Engineering Services", buyerGstin: "27FAKEN9876P1Z1",
        items: [["Hex Bolt Set", "100", "80.00", "8,000.00"]],
        subtotal: "8,000.00", cgst: "0.00", sgst: "0.00", igst: "1,440.00", total: "9,440.00"
      },
      "low-quality-missing-quantity": {
        supplier: "Satpura Electricals", gstin: "23UVWXY2468R1Z8", address: "Arera Colony, Bhopal, MP",
        number: "SE-00192", date: "23 Aug 2026", buyer: "Metro Distributors", buyerGstin: "23FAKEM1234N1Z6",
        items: [["Copper Cable Roll", "", "1,200.00", "3,600.00"]],
        subtotal: "3,600.00", cgst: "324.00", sgst: "324.00", igst: "0.00", total: "4,248.00", lowQuality: true
      }
    };

    const selected = new URLSearchParams(location.search).get("case") || "clean-domestic";
    const invoice = cases[selected] || cases["clean-domestic"];
    const itemRows = invoice.items.map((item, index) => `
      <tr>
        <td>${index + 1}</td>
        <td>${item[0]}</td>
        <td class="number">${item[1] || "-"}</td>
        <td class="number">Rs. ${item[2]}</td>
        <td class="number">Rs. ${item[3]}</td>
      </tr>`).join("");

    document.getElementById("invoice").classList.toggle("low-quality", Boolean(invoice.lowQuality));
    document.getElementById("invoice").innerHTML = `
      <section class="header">
        <div>
          <div class="brand">${invoice.supplier}</div>
          <div class="brand-subtitle">Tax Invoice | ${invoice.address}</div>
        </div>
        <div>
          <div class="invoice-title">TAX INVOICE</div>
          <div class="invoice-number">Invoice No: <strong>${invoice.number}</strong></div>
          <div class="invoice-number">Invoice Date: <strong>${invoice.date}</strong></div>
        </div>
      </section>
      <section class="columns">
        <div>
          <div class="label">Supplier Details</div>
          <div class="value"><strong>${invoice.supplier}</strong></div>
          <div class="value">${invoice.address}</div>
          <div class="value">GSTIN: ${invoice.gstin ? invoice.gstin : '<span class="missing">Not printed on invoice</span>'}</div>
        </div>
        <div>
          <div class="label">Bill To</div>
          <div class="value"><strong>${invoice.buyer}</strong></div>
          <div class="value">GSTIN: ${invoice.buyerGstin}</div>
          <div class="value">Payment Terms: 30 Days</div>
        </div>
      </section>
      <table>
        <thead><tr><th>Sr.</th><th>Description</th><th class="number">Qty</th><th class="number">Rate</th><th class="number">Amount</th></tr></thead>
        <tbody>${itemRows}</tbody>
      </table>
      <section class="bottom">
        <div class="note">This is a synthetic invoice fixture created only for LedgerFlow testing. No real financial or business data is included.</div>
        <div class="totals">
          <div class="total-row"><span>Subtotal</span><span>Rs. ${invoice.subtotal}</span></div>
          <div class="total-row"><span>CGST</span><span>Rs. ${invoice.cgst}</span></div>
          <div class="total-row"><span>SGST</span><span>Rs. ${invoice.sgst}</span></div>
          <div class="total-row"><span>IGST</span><span>Rs. ${invoice.igst}</span></div>
          <div class="total-row grand-total"><span>Invoice Total</span><span>Rs. ${invoice.total}</span></div>
        </div>
      </section>
      <section class="signature">For ${invoice.supplier}<br><br><strong>Authorized Signatory</strong></section>
      <footer class="footer">Computer generated invoice. This document is only a synthetic software test fixture.</footer>`;
  </script>
</body>
</html>
